---
username: ko
groupname: ko
homedir: /home/ko
git_user: PHS VM Test
git_email: phs-vm@example.invalid
shell: /bin/zsh

modules:
  - packages
  - git
  - zsh
  - nfs
  - desktop
  - services
  - printer
  - font

