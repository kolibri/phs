  - nano

services:
  - sshd

nfs_sources:
  - source: 192.168.76.2:/srv/phs-test
    target: /mnt/phs-test
    options: nfs defaults,_netdev 0 0

printers:
  - name: test-printer
    uri: ipp://192.168.76.2:8000/ipp/print
    default: true
