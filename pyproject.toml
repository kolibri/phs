[project]
name = "phs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ko.libri", email = "entengelb@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.23.3",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
phs = "phs.cli:run"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "phs.execution.ExecutionOptions",
    "phs.settings.Settings",
]
[tool.ruff]
extend-exclude = [
    "tests/vm/hostconfig/files",
]

[tool.ruff.lint]
extend-select = [
    "B",
    "I",
    "UP",
]
