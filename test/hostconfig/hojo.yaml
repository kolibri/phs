---
hostname: hojo.ko
ip: 127.0.0.1
ssh_port: 2222
hdd: /dev/nvme0n1

modules:
  - packages
  - git
  - zsh
  - docker
  - desktop


packages:
#  - docker
  - nano
  - firefox
aur_packages:
  - firefox-profile-switcher-connector-bin
  - ttf-merriweather
  - ttf-merriweather-sans
  - ttf-quintessential
  - ttf-signika
#  - ttf-google-fonts-git

files:
  -
    target: ~/.zshrc
    src: files/hojo/zshrc

services:
  - docker

desktop:
  type: qtile
  config_file: qtile/config.aerith.py

